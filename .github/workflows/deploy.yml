name: Deploy SDMAF to Beget VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (isolated user)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "--> Переход в рабочую папку проекта..."
            cd /home/sdmaf/app

            echo "--> Забираем последние изменения из Git..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            echo "--> Установка зависимостей..."
            npm install --silent

            echo "--> Сборка продакшн-бандла..."
            npm run build

            echo "--> Перезагрузка Nginx..."
            sudo /bin/systemctl reload nginx

            echo "--> Готово! Сайт успешно обновлен на sdmaf.magmastack.ru"
