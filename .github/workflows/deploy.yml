name: Deploy SDMAF to Beget VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "--> Переход в рабочую папку проекта..."
            cd /var/www/sdmaf

            echo "--> Забираем последние изменения из приватного Git..."
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "--> Установка зависимостей..."
            if [ -f package-lock.json ]; then
              npm ci --silent
            else
              npm install --no-package-lock --silent
            fi

            echo "--> Сборка продакшн-бандла (Vite + Express)..."
            npm run build

            echo "--> Перезапуск только процесса sdmaf в PM2 (без влияния на другие сервисы)..."
            if pm2 describe sdmaf > /dev/null 2>&1; then
              NODE_ENV=production pm2 reload sdmaf --update-env
            else
              NODE_ENV=production pm2 start dist/server.cjs --name sdmaf
            fi
            pm2 save

            echo "--> Проверка конфигурации и плавная перезагрузка Nginx..."
            nginx -t && systemctl reload nginx

            echo "--> Готово! Сайт sdmaf.ru успешно обновлен."
