<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — Страница не найдена | Завод «Стальное Дело»</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 600px;
        padding: 40px 20px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: #fef3c7;
        color: #78350f;
        font-size: 12px;
        font-weight: 700;
        font-family: monospace;
        border-radius: 9999px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 72px;
        margin: 0 0 10px 0;
        font-weight: 900;
        font-family: monospace;
      }
      h2 {
        font-size: 22px;
        margin: 0 0 16px 0;
        color: #171717;
      }
      p {
        font-size: 15px;
        color: #525252;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #0a0a0a;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #262626;
      }
      .btn-secondary {
        background: #f5f5f5;
        color: #171717;
        border: 1px solid #e5e5e5;
      }
      .btn-secondary:hover {
        background: #e5e5e5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Ошибка 404 • Ресурс не найден</div>
      <h1>404</h1>
      <h2>Чертеж не найден или страница была перемещена</h2>
      <p>Запрашиваемая страница не существует. Воспользуйтесь ссылками ниже для перехода в нужный раздел завода «Стальное Дело».</p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">На главную страницу</a>
        <a href="/catalog" class="btn btn-secondary">Каталог МАФ и мебели</a>
        <a href="/contacts" class="btn btn-secondary">Контакты завода</a>
      </div>
    </div>
  </body>
</html>
